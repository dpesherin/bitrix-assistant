name: Build static PHP for LSP

# Собирает статические бинарники PHP (server/bin/php-<os>-<arch>) под все
# поддерживаемые платформы. Запускается вручную или на тег v*.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux-x64
            spc: spc-linux-x86_64
            binary: php-linux-x64
            arch: x86_64
          - os: ubuntu-24.04-arm
            key: linux-arm64
            spc: spc-linux-aarch64
            binary: php-linux-arm64
            arch: aarch64
          # macos-13 и macos-14 выведены из GitHub Actions: macos-14 теперь
          # только x64 и в deprecated. arm64 — macos-15/macos-latest,
          # x64 — macos-15-intel.
          - os: macos-15-intel
            key: darwin-x64
            spc: spc-macos-x86_64
            binary: php-darwin-x64
            arch: x86_64
          - os: macos-15
            key: darwin-arm64
            spc: spc-macos-aarch64
            binary: php-darwin-arm64
            arch: arm64
          - os: windows-2022
            key: win32-x64
            spc: spc-windows-x64.exe
            binary: php-win32-x64.exe
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download static-php-cli
        shell: bash
        run: |
          curl -#fSL "https://dl.static-php.dev/v3/spc-bin/nightly/${{ matrix.spc }}" -o spc
          chmod +x spc || true

      - name: Check runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          expected="${{ matrix.arch }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Раннер ${{ matrix.os }} отдал архитектуру $actual, ожидали $expected — бинарник был бы чужой." >&2
            exit 1
          fi
          echo "Архитектура $actual ✓"

      # doctor при --auto-fix тоже качает готовые артефакты с GitHub (например
      # pkg-config) и без токена упирается в анонимный лимит API: spc показывает
      # «Download artifact 'pkg-config' failed. Please check your internet connection»
      # и завершается кодом 69. Поэтому токен и повторы — как у сборки ниже.
      - name: Check build environment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "==> spc doctor --auto-fix, попытка $attempt"
            if ./spc doctor --auto-fix; then
              echo "Окружение готово"
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "spc doctor не удался, повтор через $((attempt * 20)) c" >&2
              sleep "$((attempt * 20))"
            fi
          done
          echo "spc doctor не удался после 3 попыток" >&2
          exit 1

      # pcntl и posix не поддерживаются в static-php-cli на Windows —
      # для win32-* убираем их из craft.yml (сервер их не использует).
      - name: Prepare craft.yml for platform
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.key }}" == win32-* ]]; then
            sed -i.bak -e 's/^\(extensions:.*\),pcntl,posix$/\1/' craft.yml
            rm -f craft.yml.bak
          fi
          grep -n '^extensions' craft.yml

      # GitHub-hosted раннеры делят IP и упираются в лимиты: анонимный GitHub API
      # (exit 75), а также php.net, который на `releases/index.php?json` иногда
      # отдаёт HTML вместо JSON — spc отвечает «Invalid PHP release info
      # received for version 8.4». Повторяем сборку несколько раз: spc кэширует
      # уже скачанное, так что повтор не начинает с нуля.
      - name: Build PHP (craft.yml)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "==> Попытка сборки $attempt"
            if ./spc craft; then
              echo "Сборка удалась"
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              echo "Сборка не удалась, повтор через $((attempt * 30)) c" >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "Сборка не удалась после 5 попыток" >&2
          exit 1

      # Если сборка всё же упала — в лог попадает то, что видит раннер: код
      # ответа php.net и хвост вывода spc. Без этого причину не видно.
      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          echo "== php.net releases/index.php?json&version=8.4"
          curl -sS -m 30 -o /dev/null -w "http_code=%{http_code} content_type=%{content_type} size=%{size_download}\n" \
            "https://www.php.net/releases/index.php?json&version=8.4" || true
          echo "== хвост spc.output.log"
          tail -n 40 log/spc.output.log 2>/dev/null || true

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p server/bin
          if [ -f buildroot/bin/php ]; then
            cp buildroot/bin/php "server/bin/${{ matrix.binary }}"
          else
            cp buildroot/bin/php.exe "server/bin/${{ matrix.binary }}"
          fi
          chmod +x "server/bin/${{ matrix.binary }}" || true

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="server/bin/${{ matrix.binary }}"
          "$bin" -v
          mods="$("$bin" -m | tr -d '\r')"
          for ext in pdo_sqlite sqlite3 mbstring tokenizer phar; do
            if ! grep -qix "$ext" <<<"$mods"; then
              echo "Нет обязательного расширения: $ext" >&2
              exit 1
            fi
          done
          if [[ "${{ matrix.key }}" != win32-* ]]; then
            for ext in pcntl posix; do
              if ! grep -qix "$ext" <<<"$mods"; then
                echo "Нет расширения $ext для ${{ matrix.key }}" >&2
                exit 1
              fi
            done
          fi
          echo "Расширения в порядке"

      - uses: actions/upload-artifact@v4
        with:
          name: static-php-${{ matrix.key }}
          path: server/bin/${{ matrix.binary }}
          if-no-files-found: error
